name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/amazonlite

jobs:
  test:
    name: Test Microservices
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Tests
        run: |
          echo "Running tests for all microservices sequentially..."
          for dir in services/*-service; do
            if [ -d "$dir" ] && [ -f "$dir/pom.xml" ]; then
              echo "====================================================="
              echo "Testing service: $dir"
              echo "====================================================="
              cd "$dir"
              mvn test -B
              cd ../..
            fi
          done

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag and Registry
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=sha-$SHORT_SHA" >> $GITHUB_ENV
          echo "REGISTRY=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push with Docker Compose
        run: |
          # Create a dummy .env file to satisfy docker-compose requirements during build
          touch services/.env
          
          SERVICES="amazonlite-backend"
          
          # Build and push the specific SHA tag
          docker compose build $SERVICES
          docker compose push $SERVICES
          
          # Tag and push the latest tag for Render auto-deploys (only on main branch)
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            export IMAGE_TAG="latest"
            docker compose build $SERVICES
            docker compose push $SERVICES
          fi

