name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/amazonlite

jobs:
  test:
    name: Test Microservices
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Tests
        run: |
          echo "Running tests for all microservices sequentially..."
          for dir in services/*-service; do
            if [ -d "$dir" ] && [ -f "$dir/pom.xml" ]; then
              echo "====================================================="
              echo "Testing service: $dir"
              echo "====================================================="
              cd "$dir"
              mvn test -B
              cd ../..
            fi
          done

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=sha-$SHORT_SHA" >> $GITHUB_ENV

      - name: Build and Push with Docker Compose
        run: |
          # Use docker-compose to build all services defined with build contexts
          docker-compose build
          docker-compose push

  deploy:
    name: Deploy Application
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=sha-$SHORT_SHA" >> $GITHUB_ENV

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG, REGISTRY
          script: |
            mkdir -p ~/amazonlite-backend/scripts
            
      - name: Copy Deploy Script and Docker Compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "scripts/deploy.sh,docker-compose.yml"
          target: "~/amazonlite-backend/"
          
      - name: Execute Deploy Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG, REGISTRY
          script: |
            chmod +x ~/amazonlite-backend/scripts/deploy.sh
            
            # The repository owner should be lowercase for GHCR
            export REGISTRY=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')
            
            cd ~/amazonlite-backend
            ./scripts/deploy.sh "$IMAGE_TAG" "$REGISTRY"
