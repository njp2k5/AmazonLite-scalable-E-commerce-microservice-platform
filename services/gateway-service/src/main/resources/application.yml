server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://product-service:8081
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1

eureka:
  client:
    enabled: false

# JWT Configuration
jwt:
  secret: amazonlite-secret-key-for-jwt-encryption-minimum-256-bits-required
  expiration: 86400000  # 24 hours in milliseconds
