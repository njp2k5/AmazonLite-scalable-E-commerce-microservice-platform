version: '3.8'

services:
  registry-service:
    build:
      context: ./services/registry-service
      dockerfile: Dockerfile
    container_name: registry-service
    image: ${REGISTRY:-amazonlite}/registry-service:${IMAGE_TAG:-latest}
    ports:
      - "8761:8761"
    networks:
      - amazonlite-network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - amazonlite-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: amazonlite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - amazonlite-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    image: ${REGISTRY:-amazonlite}/auth-service:${IMAGE_TAG:-latest}
    ports:
      - "8082:8082"
    env_file:
      - ./services/.env
    environment:
      SPRING_APPLICATION_NAME: auth-service
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://registry-service:8761/eureka/"
      EUREKA_INSTANCE_HOSTNAME: "auth-service"
      DB_URL: "jdbc:postgresql://postgres:5432/amazonlite"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "amazonlite"
      DB_USERNAME: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
    depends_on:
      - registry-service
      - postgres
    networks:
      - amazonlite-network

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: product-service
    image: ${REGISTRY:-amazonlite}/product-service:${IMAGE_TAG:-latest}
    ports:
      - "8081:8081"
    env_file:
      - ./services/.env
    environment:
      SPRING_APPLICATION_NAME: product-service
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://registry-service:8761/eureka/"
      EUREKA_INSTANCE_HOSTNAME: "product-service"
      DB_URL: "jdbc:postgresql://postgres:5432/amazonlite"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "amazonlite"
      DB_USERNAME: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
    depends_on:
      - registry-service
      - postgres
    networks:
      - amazonlite-network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    image: ${REGISTRY:-amazonlite}/order-service:${IMAGE_TAG:-latest}
    ports:
      - "8083:8083"
    env_file:
      - ./services/.env
    environment:
      SPRING_APPLICATION_NAME: order-service
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://registry-service:8761/eureka/"
      EUREKA_INSTANCE_HOSTNAME: "order-service"
      DB_URL: "jdbc:postgresql://postgres:5432/amazonlite"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "amazonlite"
      DB_USERNAME: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
    depends_on:
      - registry-service
      - postgres
    networks:
      - amazonlite-network

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    image: ${REGISTRY:-amazonlite}/inventory-service:${IMAGE_TAG:-latest}
    ports:
      - "8085:8085"
    env_file:
      - ./services/.env
    environment:
      SPRING_APPLICATION_NAME: inventory-service
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://registry-service:8761/eureka/"
      EUREKA_INSTANCE_HOSTNAME: "inventory-service"
      DB_URL: "jdbc:postgresql://postgres:5432/amazonlite"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "amazonlite"
      DB_USERNAME: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
    depends_on:
      - registry-service
      - postgres
    networks:
      - amazonlite-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    image: ${REGISTRY:-amazonlite}/notification-service:${IMAGE_TAG:-latest}
    ports:
      - "8084:8084"
    env_file:
      - ./services/.env
    environment:
      SPRING_APPLICATION_NAME: notification-service
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://registry-service:8761/eureka/"
      EUREKA_INSTANCE_HOSTNAME: "notification-service"
      DB_URL: "jdbc:postgresql://postgres:5432/amazonlite"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "amazonlite"
      DB_USERNAME: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
    depends_on:
      - registry-service
      - postgres
    networks:
      - amazonlite-network

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    image: ${REGISTRY:-amazonlite}/cart-service:${IMAGE_TAG:-latest}
    ports:
      - "8086:8086"
    env_file:
      - ./services/.env
    environment:
      SPRING_APPLICATION_NAME: cart-service
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://registry-service:8761/eureka/"
      EUREKA_INSTANCE_HOSTNAME: "cart-service"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      DB_URL: "jdbc:postgresql://postgres:5432/amazonlite"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "amazonlite"
      DB_USERNAME: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
    depends_on:
      - registry-service
      - redis
      - postgres
    networks:
      - amazonlite-network

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    image: ${REGISTRY:-amazonlite}/gateway-service:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    env_file:
      - ./services/.env
    environment:
      SPRING_APPLICATION_NAME: gateway-service
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://registry-service:8761/eureka/"
      EUREKA_INSTANCE_HOSTNAME: "gateway-service"
    depends_on:
      - registry-service
      - product-service
      - order-service
      - auth-service
      - inventory-service
      - notification-service
      - cart-service
    networks:
      - amazonlite-network

  ecommerce-frontend:
    build:
      context: ../ecommerce-frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - amazonlite-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - amazonlite-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - amazonlite-network

networks:
  amazonlite-network:
    driver: bridge
