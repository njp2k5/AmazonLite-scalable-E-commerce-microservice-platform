global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'amazonlite-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'registry-service:8761'
          - 'gateway-service:8080'
          - 'auth-service:8082'
          - 'product-service:8081'
          - 'order-service:8083'
          - 'inventory-service:8085'
          - 'notification-service:8084'
          - 'cart-service:8086'
